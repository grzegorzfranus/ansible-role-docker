---
# =============================================================================
# Ansible Role: Docker - Handlers: Service Management
# =============================================================================
# Service management operations triggered by tasks.
# =============================================================================

- name: Docker | handlers | Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Docker | handlers | Restart docker service
  become: true
  ansible.builtin.service:
    name: "{{ __docker_service_name }}"
    state: restarted
  when:
    - docker_manage_service_restart | bool

- name: Docker | handlers | Restart rsyslog
  become: true
  ansible.builtin.service:
    name: rsyslog
    state: restarted
  when:
    - docker_manage_service_restart | bool

# Justification: augenrules --load is required on EL9/systemd systems because
# systemctl restart auditd is refused by systemd.
- name: Docker | handlers | Restart auditd
  become: true
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true
  when:
    - docker_manage_service_restart | bool
