# =============================================================================
# Ansible Role: Docker - Molecule Verification Playbook (Logging Scenario)
# =============================================================================

---
- name: Verify
  hosts: all
  gather_facts: true

  vars_files:
    - "../../defaults/main.yml"
    - "../../vars/main.yml"

  tasks:
    - name: Verify | Gather OS specific variables
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}.yml"
            - "main.yml"
          paths:
            - "../../vars"

    - name: Verify | Stat /etc/rsyslog.d/99-docker.conf
      ansible.builtin.stat:
        path: /etc/rsyslog.d/99-docker.conf
      register: __rsyslog_conf_stat

    - name: Verify | Assert rsyslog configuration file exists with 0644 root:root
      ansible.builtin.assert:
        that:
          - "__rsyslog_conf_stat.stat.exists"
          - "__rsyslog_conf_stat.stat.mode == '0644'"
          - "__rsyslog_conf_stat.stat.pw_name == 'root'"
          - "__rsyslog_conf_stat.stat.gr_name == 'root'"
        fail_msg: "/etc/rsyslog.d/99-docker.conf is missing or has incorrect permissions."
        success_msg: "/etc/rsyslog.d/99-docker.conf exists with mode 0644 root:root."

    - name: Verify | Stat log directory /var/log/docker
      ansible.builtin.stat:
        path: /var/log/docker
      register: __docker_log_dir_stat

    - name: Verify | Assert log directory ownership matches OS expectations
      ansible.builtin.assert:
        that:
          - "__docker_log_dir_stat.stat.exists"
          - "__docker_log_dir_stat.stat.pw_name == __docker_os_log_user_default"
          - "__docker_log_dir_stat.stat.gr_name == __docker_os_log_group_default"
        fail_msg: >-
          Log directory /var/log/docker owner/group does not match OS default
          (expected {{ __docker_os_log_user_default }}:{{ __docker_os_log_group_default }},
          got {{ __docker_log_dir_stat.stat.pw_name }}:{{ __docker_log_dir_stat.stat.gr_name }}).
        success_msg: "Log directory /var/log/docker owner and group match OS default."

    - name: Verify | Stat /etc/logrotate.d/docker
      ansible.builtin.stat:
        path: /etc/logrotate.d/docker
      register: __logrotate_conf_stat

    - name: Verify | Test logrotate configuration syntax
      ansible.builtin.command: logrotate -d /etc/logrotate.d/docker
      register: __logrotate_cmd
      changed_when: false

    - name: Verify | Assert logrotate configuration valid
      ansible.builtin.assert:
        that:
          - "__logrotate_conf_stat.stat.exists"
          - "__logrotate_cmd.rc == 0"
        fail_msg: "logrotate configuration /etc/logrotate.d/docker is missing or failed syntax check."
        success_msg: "/etc/logrotate.d/docker exists and passed logrotate -d syntax check."

    - name: Verify | Test V1 regression guard — apply explicit owner override
      ansible.builtin.include_role:
        name: ../../..
      vars:
        docker_configure_rsyslog: true
        docker_rsyslog_log_file_owner: "nobody"

    - name: Verify | Stat log directory after explicit owner override
      ansible.builtin.stat:
        path: /var/log/docker
      register: __docker_log_dir_override_stat

    - name: Verify | Assert V1 regression guard (explicit owner override updated live directory)
      ansible.builtin.assert:
        that:
          - "__docker_log_dir_override_stat.stat.pw_name == 'nobody'"
        fail_msg: >-
          V1 regression detected! Explicit docker_rsyslog_log_file_owner override did not update directory owner to nobody
          (got {{ __docker_log_dir_override_stat.stat.pw_name }}).
        success_msg: "V1 regression guard passed: explicit owner override changed directory ownership to nobody."
