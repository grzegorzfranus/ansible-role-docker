# =============================================================================
# Ansible Role: Docker - Molecule Convergence Playbook (Logging Scenario)
# =============================================================================

---
- name: Converge | Install Docker with default rsyslog log owner
  hosts: all

  pre_tasks:
    - name: Converge | Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Converge | Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

  roles:
    - role: ../../..
      vars:
        docker_configure_rsyslog: true

  post_tasks:
    - name: Converge | Stat log directory after default installation
      ansible.builtin.stat:
        path: /var/log/docker
      register: __docker_log_dir_default_stat

    - name: Converge | Save default log directory owner to marker file
      ansible.builtin.copy:
        content: "{{ __docker_log_dir_default_stat.stat.pw_name }}"
        dest: /tmp/.v1_default_owner
        mode: "0644"

- name: Converge | Re-apply with explicit owner override (V1 guard)
  hosts: all

  roles:
    - role: ../../..
      vars:
        docker_configure_rsyslog: true
        docker_rsyslog_log_file_owner: "nobody"
