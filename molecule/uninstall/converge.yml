# =============================================================================
# Ansible Role: Docker - Molecule Convergence Playbook (Uninstall Scenario)
# =============================================================================

---
- name: Converge | Install Docker with extra features
  hosts: all

  pre_tasks:
    - name: Converge | Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Converge | Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

  roles:
    - role: ../../..
      vars:
        docker_configure_rsyslog: true
        docker_prune_enabled: true
        docker_backup_enabled: true
        docker_audit_socket: true
        # Disable service restarts and augenrules execution in container test environment
        docker_manage_service_restart: false

- name: "Converge | Remove Docker (docker_state: absent)"
  hosts: all

  roles:
    - role: ../../..
      vars:
        docker_state: absent
        docker_configure_rsyslog: true

- name: "Converge | Test invalid log directory protection (H2 Guard)"
  hosts: all

  tasks:
    - name: Converge | Attempt removal with docker_log_directory_path=/var/log
      block:
        - name: Converge | Include role with invalid log directory path
          ansible.builtin.include_role:
            name: ../../..
          vars:
            docker_state: absent
            docker_configure_rsyslog: true
            docker_log_directory_path: "/var/log"

        - name: Converge | Ensure marker file absent if validation failed to reject
          ansible.builtin.file:
            path: /tmp/.h2_guard_passed
            state: absent
      rescue:
        - name: Converge | Create marker file on validation rejection of invalid log directory
          ansible.builtin.file:
            path: /tmp/.h2_guard_passed
            state: touch
            mode: "0644"
