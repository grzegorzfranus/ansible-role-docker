# =============================================================================
# Ansible Role: Docker - Molecule Verification Playbook (Default Scenario)
# =============================================================================

---
- name: "molecule | Verify Default Scenario"
  hosts: all
  gather_facts: true

  vars_files:
    - "../../defaults/main.yml"
    - "../../vars/main.yml"

  tasks:
    - name: Verify | Gather OS specific variables
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] | lower }}.yml"
            - "{{ ansible_facts['distribution'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
            - "{{ ansible_facts['os_family'] | lower }}.yml"
            - "main.yml"
          paths:
            - "../../vars"

    - name: Verify | Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify | Assert Docker packages installed
      ansible.builtin.assert:
        that:
          - "'docker-ce' in ansible_facts.packages"
          - "'docker-ce-cli' in ansible_facts.packages"
          - "'containerd.io' in ansible_facts.packages"
        fail_msg: "One or more required Docker packages (docker-ce, docker-ce-cli, containerd.io) are missing."
        success_msg: "All required Docker packages are installed."

    - name: Verify | Gather service facts
      ansible.builtin.service_facts:

    - name: Verify | Assert Docker service running and enabled
      ansible.builtin.assert:
        that:
          - "'docker.service' in ansible_facts.services"
          - "ansible_facts.services['docker.service'].state == 'running'"
          - "ansible_facts.services['docker.service'].status == 'enabled'"
        fail_msg: "Docker service is not running or not enabled."
        success_msg: "Docker service is running and enabled."

    - name: Verify | Stat daemon.json
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: __docker_daemon_stat

    - name: Verify | Slurp daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: __docker_daemon_slurp
      when: __docker_daemon_stat.stat.exists

    - name: Verify | Assert daemon.json permissions and content
      ansible.builtin.assert:
        that:
          - "__docker_daemon_stat.stat.exists"
          - "__docker_daemon_stat.stat.mode == '0644'"
          - "__docker_daemon_stat.stat.pw_name == 'root'"
          - "__docker_daemon_stat.stat.gr_name == 'root'"
          - "(__docker_daemon_slurp.content | b64decode | from_json)['log-driver'] == 'json-file'"
          - "(__docker_daemon_slurp.content | b64decode | from_json)['log-opts']['max-size'] == '10m'"
          - "(__docker_daemon_slurp.content | b64decode | from_json)['log-opts']['max-file'] == '3'"
        fail_msg: "daemon.json is missing, has incorrect permissions, or invalid JSON content."
        success_msg: "daemon.json exists, has correct 0644 root:root permissions, and valid JSON configuration."

    - name: Verify | Stat docker.sock
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: __docker_sock_stat

    - name: Verify | Assert docker.sock permissions
      ansible.builtin.assert:
        that:
          - "__docker_sock_stat.stat.exists"
          - "__docker_sock_stat.stat.gr_name == 'docker'"
          - "__docker_sock_stat.stat.mode == '0660'"
        fail_msg: "docker.sock has incorrect permissions or group ownership."
        success_msg: "docker.sock exists with 0660 mode and docker group ownership."

    - name: Verify | Check docker CLI version
      ansible.builtin.command: docker --version
      register: __docker_version_cmd
      changed_when: false

    - name: Verify | Assert docker CLI operational
      ansible.builtin.assert:
        that:
          - "__docker_version_cmd.rc == 0"
        fail_msg: "docker --version failed with exit code {{ __docker_version_cmd.rc }}."
        success_msg: "docker CLI is functional."

    - name: Verify | Get systemctl ExecStart for docker
      ansible.builtin.command: systemctl show docker -p ExecStart
      register: __docker_execstart_cmd
      changed_when: false

    - name: Verify | Stat default override.conf
      ansible.builtin.stat:
        path: /etc/systemd/system/docker.service.d/override.conf
      register: __docker_override_stat

    - name: Verify | Assert H1 regression guard
      ansible.builtin.assert:
        that:
          - "'--containerd=' in __docker_execstart_cmd.stdout"
          - "not __docker_override_stat.stat.exists"
        fail_msg: "H1 regression detected: ExecStart missing --containerd= or unexpected override.conf exists."
        success_msg: "H1 regression guard passed: ExecStart contains --containerd= and no override.conf exists by default."

    - name: Verify | Check containerd process count
      ansible.builtin.command: pgrep -c -x containerd
      register: __containerd_pgrep_cmd
      changed_when: false
      failed_when: false

    - name: Verify | Assert single containerd process running
      ansible.builtin.assert:
        that:
          - "__containerd_pgrep_cmd.rc == 0"
          - "__containerd_pgrep_cmd.stdout | trim == '1'"
        fail_msg: "Expected exactly 1 containerd process, found {{ __containerd_pgrep_cmd.stdout | trim }}."
        success_msg: "Exactly one containerd process is running."

    - name: Verify | Test container execution
      ansible.builtin.command: docker run --rm hello-world
      register: __docker_hello_cmd
      changed_when: false
      failed_when: false

    - name: Verify | Assert container execution succeeds
      ansible.builtin.assert:
        that:
          - "__docker_hello_cmd.rc == 0"
        fail_msg: "docker run hello-world failed: {{ __docker_hello_cmd.stderr }}"
        success_msg: "docker run hello-world executed successfully."
      when: __docker_hello_cmd.rc == 0 or 'Unable to find image' not in __docker_hello_cmd.stderr

    - name: Verify | Stat docker-prune-volumes helper
      become: true
      ansible.builtin.stat:
        path: /usr/local/sbin/docker-prune-volumes
      register: __docker_prune_volumes_stat

    - name: Verify | Assert docker-prune-volumes helper exists and permissions
      ansible.builtin.assert:
        that:
          - __docker_prune_volumes_stat.stat.exists
          - __docker_prune_volumes_stat.stat.pw_name == 'root'
          - __docker_prune_volumes_stat.stat.gr_name == 'root'
          - __docker_prune_volumes_stat.stat.mode == '0750'
        fail_msg: "docker-prune-volumes helper is missing, not owned by root, or has incorrect mode."
        success_msg: "docker-prune-volumes helper exists, is owned by root, and has mode 0750."

    - name: Verify | Slurp docker-prune.service
      become: true
      ansible.builtin.slurp:
        src: /etc/systemd/system/docker-prune.service
      register: __docker_prune_service_slurp

    - name: Verify | Assert docker-prune.service contains volume prune ExecStart
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/local/sbin/docker-prune-volumes' in (__docker_prune_service_slurp.content | b64decode)"
        fail_msg: "docker-prune.service does not contain ExecStart=/usr/local/sbin/docker-prune-volumes."
        success_msg: "docker-prune.service contains ExecStart=/usr/local/sbin/docker-prune-volumes."

    - name: Verify | Create fresh test volume
      become: true
      ansible.builtin.command: docker volume create molecule-prune-fresh

    - name: Verify | Run volume prune helper with default age
      become: true
      ansible.builtin.command: /usr/local/sbin/docker-prune-volumes

    - name: Verify | Inspect fresh test volume after default prune
      become: true
      ansible.builtin.command: docker volume inspect molecule-prune-fresh
      register: __docker_volume_fresh_inspect_default
      failed_when: false
      changed_when: false

    - name: Verify | Assert fresh volume survives default age prune
      ansible.builtin.assert:
        that:
          - __docker_volume_fresh_inspect_default.rc == 0
        fail_msg: "Fresh volume was unexpectedly removed by default prune."
        success_msg: "Fresh volume survived default prune as expected."

    - name: Verify | Run volume prune helper with zero age
      become: true
      ansible.builtin.command: /usr/local/sbin/docker-prune-volumes 0

    - name: Verify | Inspect fresh test volume after zero age prune
      become: true
      ansible.builtin.command: docker volume inspect molecule-prune-fresh
      register: __docker_volume_fresh_inspect_zero
      failed_when: false
      changed_when: false

    - name: Verify | Assert unused volume past age is removed
      ansible.builtin.assert:
        that:
          - __docker_volume_fresh_inspect_zero.rc != 0
        fail_msg: "Unused volume was not removed by zero age prune."
        success_msg: "Unused volume was removed by zero age prune as expected."

    - name: Verify | Inspect hello-world image presence
      become: true
      ansible.builtin.command: docker image inspect hello-world
      register: __docker_hello_world_inspect
      failed_when: false
      changed_when: false

    # docker create -v <name>:/data creates the named volume and attaches it. Inside the molecule
    # container this can fail because overlayfs cannot be nested, which is also why "Test container
    # execution" tolerates failure; the attached-volume check then runs only where a container
    # could actually be created.
    - name: Verify | Create container referencing attached volume
      become: true
      ansible.builtin.command: docker create --name molecule-prune-holder -v molecule-prune-attached:/data hello-world
      register: __docker_prune_holder_create
      failed_when: false
      changed_when: false
      when: __docker_hello_world_inspect.rc == 0

    - name: Verify | Run volume prune helper with zero age for attached volume check
      become: true
      ansible.builtin.command: /usr/local/sbin/docker-prune-volumes 0
      changed_when: false
      when: __docker_prune_holder_create.rc | default(1) == 0

    - name: Verify | Inspect attached test volume
      become: true
      ansible.builtin.command: docker volume inspect molecule-prune-attached
      register: __docker_attached_inspect
      failed_when: false
      changed_when: false
      when: __docker_prune_holder_create.rc | default(1) == 0

    - name: Verify | Assert attached volume is not removed
      ansible.builtin.assert:
        that:
          - __docker_attached_inspect.rc == 0
        fail_msg: "Volume attached to stopped container was unexpectedly removed."
        success_msg: "Volume attached to stopped container was retained as expected."
      when: __docker_prune_holder_create.rc | default(1) == 0

    - name: Verify | Cleanup test container holder
      become: true
      ansible.builtin.command: docker rm --force molecule-prune-holder
      failed_when: false
      changed_when: false

    - name: Verify | Cleanup attached test volume
      become: true
      ansible.builtin.command: docker volume rm molecule-prune-attached
      failed_when: false
      changed_when: false
