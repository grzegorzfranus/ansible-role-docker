---
# =============================================================================
# Ansible Role: Docker - Tasks: Audit Rule Configuration
# =============================================================================
# Configures auditd watch rule for /run/docker.sock socket access.
# =============================================================================

- name: Docker | audit | Check if auditctl exists
  become: true
  ansible.builtin.stat:
    path: /sbin/auditctl
  register: __docker_auditctl

- name: Docker | audit | Warn if auditctl is not available
  ansible.builtin.debug:
    msg: "auditctl not found at /sbin/auditctl; skipping Docker socket audit rule configuration."
  when:
    - not __docker_auditctl.stat.exists

- name: Docker | audit | Configure audit rule for /run/docker.sock
  become: true
  ansible.builtin.lineinfile:
    path: /etc/audit/rules.d/docker.rules
    state: present
    create: true
    line: "-w /run/docker.sock -p wa -k docker-sock"
    mode: '0644'
    owner: root
    group: root
  when:
    - __docker_auditctl.stat.exists
  notify: Docker | handlers | Restart auditd
