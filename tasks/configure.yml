---
# =============================================================================
# Ansible Role: Docker - Tasks: Daemon and Service Drop-in Configuration
# =============================================================================
# Configures /etc/docker/daemon.json using Ansible dict rendering, systemd
# drop-in overrides for TCP socket/proxies, and socket group permissions.
# =============================================================================

- name: Docker | configure | Ensure /etc/docker exists
  become: true
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

# Note: {{ ansible_managed }} comment block is omitted from daemon.json.j2
# because JSON standard does not support comment syntax.
- name: Docker | configure | Render daemon.json
  become: true
  ansible.builtin.template:
    src: docker/daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    backup: true
  vars:
    __docker_daemon_base:
      log-driver: "{{ docker_log_driver }}"
      log-opts: "{{ docker_log_opts }}"
    __docker_daemon_hosts: >-
      {{
        {
          'hosts': [
            'unix:///var/run/docker.sock',
            'tcp://' ~ docker_tcp_listen
          ]
        } if (docker_enable_tcp_socket | bool) else {}
      }}
    __docker_daemon_mirrors: >-
      {{
        {'registry-mirrors': docker_registry_mirrors}
        if (docker_registry_mirrors | length > 0) else {}
      }}
    __docker_daemon_tls: >-
      {{
        {
          'tls': true,
          'tlsverify': true,
          'tlscacert': docker_tcp_tls_cacert,
          'tlscert': docker_tcp_tls_cert,
          'tlskey': docker_tcp_tls_key
        } if (docker_enable_tcp_socket | bool and docker_tcp_tls_enabled | bool) else {}
      }}
    __docker_daemon_config: >-
      {{
        __docker_daemon_base
        | combine(__docker_daemon_hosts)
        | combine(__docker_daemon_mirrors)
        | combine(__docker_daemon_tls)
        | combine(docker_daemon_extra, recursive=True)
      }}
  notify:
    - Docker | handlers | Restart docker service

- name: Docker | configure | Ensure systemd drop-in dir exists for docker.service
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - (docker_enable_tcp_socket | bool) or
      (docker_http_proxy | length > 0) or
      (docker_https_proxy | length > 0) or
      (docker_no_proxy | length > 0)

- name: Docker | configure | Override ExecStart to avoid flag conflicts
  become: true
  ansible.builtin.template:
    src: systemd/docker-service-override.conf.j2
    dest: /etc/systemd/system/docker.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  when:
    - docker_enable_tcp_socket | bool
  notify:
    - Docker | handlers | Reload systemd
    - Docker | handlers | Restart docker service

- name: Docker | configure | Remove ExecStart override when TCP socket is disabled
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/override.conf
    state: absent
  when:
    - not (docker_enable_tcp_socket | bool)
  notify:
    - Docker | handlers | Reload systemd
    - Docker | handlers | Restart docker service

- name: Docker | configure | Configure proxy environment for docker.service
  become: true
  ansible.builtin.template:
    src: systemd/docker-service-proxy.conf.j2
    dest: /etc/systemd/system/docker.service.d/proxy.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  when:
    - (docker_http_proxy | length > 0) or
      (docker_https_proxy | length > 0) or
      (docker_no_proxy | length > 0)
  notify:
    - Docker | handlers | Reload systemd
    - Docker | handlers | Restart docker service

- name: Docker | configure | Ensure systemd drop-in dir exists for docker.socket
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/docker.socket.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Docker | configure | Enforce docker.sock group/mode via systemd override
  become: true
  ansible.builtin.template:
    src: systemd/docker-socket-override.conf.j2
    dest: /etc/systemd/system/docker.socket.d/override.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify:
    - Docker | handlers | Reload systemd
    - Docker | handlers | Restart docker service

- name: Docker | configure | Create user-defined networks
  ansible.builtin.include_tasks: network.yml
  when:
    - docker_networks | length > 0
