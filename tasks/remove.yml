---
# =============================================================================
# Ansible Role: Docker - Tasks: Role Removal and Cleanup
# =============================================================================
# Stops services, removes packages, configuration files, systemd drop-ins, and
# optionally purges data directory /var/lib/docker when docker_remove_data is true.
# =============================================================================

- name: Docker | remove | Stop and disable service (systemd)
  become: true
  ansible.builtin.systemd_service:
    name: "{{ __docker_service_name }}"
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Docker | remove | Stop and disable prune timer
  become: true
  ansible.builtin.systemd_service:
    name: docker-prune.timer
    state: stopped
    enabled: false
  failed_when: false
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Docker | remove | Stop and disable backup timer
  become: true
  ansible.builtin.systemd_service:
    name: docker-backup.timer
    state: stopped
    enabled: false
  failed_when: false
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Docker | remove | Remove apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'

- name: Docker | remove | Remove repository keyring (Debian)
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'

- name: Docker | remove | Remove DNF repository (RedHat)
  become: true
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    state: absent
  when:
    - ansible_facts['os_family'] == 'RedHat'

- name: Docker | remove | Remove Docker packages
  become: true
  ansible.builtin.package:
    name: >-
      {{ __docker_base_packages
        + ['docker-compose-plugin', 'docker-buildx-plugin']
        + docker_extra_packages
      }}
    state: absent

- name: Docker | remove | Remove rsyslog configuration
  become: true
  ansible.builtin.file:
    path: "/etc/rsyslog.d/{{ docker_rsyslog_conf_name }}"
    state: absent

- name: Docker | remove | Remove logrotate configuration
  become: true
  ansible.builtin.file:
    path: "/etc/logrotate.d/docker"
    state: absent

- name: Docker | remove | Remove /etc/docker configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/docker
    state: absent

- name: Docker | remove | Remove docker group
  become: true
  ansible.builtin.group:
    name: docker
    state: absent

- name: Docker | remove | Remove systemd service override
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: absent
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Docker | remove | Remove systemd socket override
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/docker.socket.d
    state: absent
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Docker | remove | Remove prune systemd units
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/docker-prune.service
    - /etc/systemd/system/docker-prune.timer

- name: Docker | remove | Remove backup systemd units
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/docker-backup.service
    - /etc/systemd/system/docker-backup.timer

- name: Docker | remove | Remove backup script
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/docker-backup
    state: absent

- name: Docker | remove | Remove audit rules
  become: true
  ansible.builtin.file:
    path: /etc/audit/rules.d/docker.rules
    state: absent

- name: Docker | remove | Reload systemd if needed
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Docker | remove | Optionally remove log directory
  become: true
  ansible.builtin.file:
    path: "{{ docker_log_directory_path }}"
    state: absent
  vars:
    __docker_log_dir_normalized: "{{ docker_log_directory_path | regex_replace('/+$', '') }}"
  when:
    - docker_configure_rsyslog | bool
    - docker_log_directory_path | length > 0
    - docker_log_directory_path is match('^/[^/]+/.+')
    - docker_log_directory_path is not match('.*/\..*')
    - >-
      __docker_log_dir_normalized not in
      ['', '/', '/var', '/var/log', '/etc', '/usr']

- name: Docker | remove | Optionally remove Docker data directory (/var/lib/docker)
  become: true
  ansible.builtin.file:
    path: /var/lib/docker
    state: absent
  when:
    - docker_remove_data | bool
