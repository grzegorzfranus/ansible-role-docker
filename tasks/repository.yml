---
# =============================================================================
# Ansible Role: Docker - Tasks: Package Repositories
# =============================================================================
# Configures official Docker GPG keys and package repositories for Debian/EL.
# =============================================================================

- name: Docker | repository | Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - ansible_facts['os_family'] == 'Debian'

- name: Docker | repository | Download Docker GPG key (ASCII)
  become: true
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts.distribution | lower == 'ubuntu' else 'debian' }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'
  register: __docker_gpg_download_result
  until: __docker_gpg_download_result is succeeded
  retries: 3
  delay: 5
  when:
    - ansible_facts['os_family'] == 'Debian'

- name: Docker | repository | Set up apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    architectures:
      - "{{ __docker_apt_arch }}"
    uris:
      - "https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts.distribution | lower == 'ubuntu' else 'debian' }}"
    suites:
      - "{{ __docker_apt_codename }}"
    components:
      - stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true
  when:
    - ansible_facts['os_family'] == 'Debian'

- name: Docker | repository | Configure yum repository (EL)
  become: true
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "{{ __docker_yum_baseurl }}"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ __docker_yum_gpgkey }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
