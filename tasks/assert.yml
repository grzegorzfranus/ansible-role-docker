---
# =============================================================================
# Ansible Role: Docker - Tasks: Variable Assertions
# =============================================================================
# Runtime validation of variable types, allowed choices, and structural integrity.
# Basic type/choice validation is handled by meta/argument_specs.yml.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Service State (Lifecycle)
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate service state choice
  ansible.builtin.assert:
    that:
      - docker_state is defined
      - docker_state is string
      - docker_state in ['present', 'absent']
      - docker_remove_data is boolean
    fail_msg: "Invalid docker_state '{{ docker_state | default('undefined') }}' or docker_remove_data flag"
    success_msg: "Service state: {{ docker_state }}"

# -----------------------------------------------------------------------------
# 2. General Settings
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate general settings
  ansible.builtin.assert:
    that:
      - docker_service_enabled is boolean
      - docker_manage_service_restart is boolean
      - docker_package_state is string
      - docker_package_state in ['present', 'latest']
      - docker_users is sequence
    fail_msg: >-
      Invalid general settings: docker_service_enabled={{ docker_service_enabled }},
      docker_manage_service_restart={{ docker_manage_service_restart }},
      docker_package_state={{ docker_package_state }},
      docker_users={{ docker_users }}
    success_msg: "General settings are valid"

- name: Docker | assert | Validate docker_users entries
  ansible.builtin.assert:
    that:
      - docker_users | reject('string') | list | length == 0
      - docker_users | select('equalto', '') | list | length == 0
    fail_msg: "docker_users entries must be non-empty strings"
    success_msg: "docker_users entries are valid"

# -----------------------------------------------------------------------------
# 3. Packages and Repository
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate package plugin flags and lists
  ansible.builtin.assert:
    that:
      - docker_install_compose_plugin is boolean
      - docker_install_buildx_plugin is boolean
      - docker_extra_packages is sequence
    fail_msg: >-
      Invalid package plugin flags or extra packages:
      docker_install_compose_plugin={{ docker_install_compose_plugin }},
      docker_install_buildx_plugin={{ docker_install_buildx_plugin }},
      docker_extra_packages={{ docker_extra_packages }}
    success_msg: "Package plugin settings are valid"

# -----------------------------------------------------------------------------
# 4. Daemon Configuration
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate daemon configuration
  ansible.builtin.assert:
    that:
      - docker_enable_tcp_socket is boolean
      - docker_tcp_listen is defined
      - docker_tcp_listen is string
      - docker_tcp_listen is match('^.+:[0-9]+$')
      - (docker_tcp_listen.split(':')[-1] | int) >= 1
      - (docker_tcp_listen.split(':')[-1] | int) <= 65535
      - docker_log_driver is defined
      - docker_log_driver is string
      - >-
        docker_log_driver in
        ['json-file', 'local', 'journald', 'syslog', 'fluentd', 'gelf', 'awslogs',
         'splunk', 'etwlogs', 'gcplogs', 'logentries', 'none']
      - docker_log_opts is defined
      - docker_log_opts is mapping
      - ('max-size' in docker_log_opts)
      - ('max-file' in docker_log_opts)
      - docker_daemon_extra is mapping
    fail_msg: "Invalid daemon configuration (driver, tcp listen, or log options missing/invalid)"
    success_msg: "Daemon configuration is valid"

- name: Docker | assert | Validate TCP socket security
  ansible.builtin.assert:
    that:
      - >-
        not (docker_enable_tcp_socket | bool) or
        (docker_tcp_listen is match('^(127\.0\.0\.1|localhost|\[::1\]):[0-9]+$')) or
        (docker_tcp_tls_enabled | bool) or
        (docker_tcp_insecure_acknowledged | bool)
    fail_msg: >-
      Binding TCP socket to non-loopback address '{{ docker_tcp_listen }}' without TLS is insecure.
      Set docker_tcp_tls_enabled: true or set docker_tcp_insecure_acknowledged: true to proceed.
    success_msg: "TCP socket security configuration is valid"

- name: Docker | assert | Validate TCP socket TLS certificate paths
  ansible.builtin.assert:
    that:
      - >-
        not (docker_enable_tcp_socket | bool and docker_tcp_tls_enabled | bool) or
        (docker_tcp_tls_cacert is string and docker_tcp_tls_cacert is match('^/'))
      - >-
        not (docker_enable_tcp_socket | bool and docker_tcp_tls_enabled | bool) or
        (docker_tcp_tls_cert is string and docker_tcp_tls_cert is match('^/'))
      - >-
        not (docker_enable_tcp_socket | bool and docker_tcp_tls_enabled | bool) or
        (docker_tcp_tls_key is string and docker_tcp_tls_key is match('^/'))
    fail_msg: >-
      When docker_tcp_tls_enabled is true, docker_tcp_tls_cacert ('{{ docker_tcp_tls_cacert }}'),
      docker_tcp_tls_cert ('{{ docker_tcp_tls_cert }}'), and docker_tcp_tls_key ('{{ docker_tcp_tls_key }}')
      must be non-empty absolute paths starting with '/'.
    success_msg: "TCP socket TLS certificate paths are valid"

- name: Docker | assert | Validate registry mirrors URLs
  ansible.builtin.assert:
    that:
      - docker_registry_mirrors is sequence
      - >-
        docker_registry_mirrors | reject('match', '^https?://') | list | length == 0
    fail_msg: "docker_registry_mirrors entries must be valid HTTP/HTTPS URLs"
    success_msg: "docker_registry_mirrors URLs are valid"

# -----------------------------------------------------------------------------
# 5. Proxy and Registry
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate proxy variables
  ansible.builtin.assert:
    that:
      - docker_http_proxy is string
      - docker_https_proxy is string
      - docker_no_proxy is string
    fail_msg: "Proxy variables must be strings"
    success_msg: "Proxy variables are valid"

# -----------------------------------------------------------------------------
# 6. Logging to Files (rsyslog + logrotate)
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate logging variables
  vars:
    __docker_log_dir_norm: "{{ docker_log_directory_path | regex_replace('/+$', '') }}"
  ansible.builtin.assert:
    that:
      - docker_configure_rsyslog is boolean
      - docker_log_directory_path is string
      - >-
        (docker_log_directory_path | length == 0) or
        (docker_log_directory_path is match('^/[^/]+/.+') and
         docker_log_directory_path is not match('.*/\..*') and
         __docker_log_dir_norm not in ['/', '/var', '/var/log', '/etc', '/usr'])
      - docker_rsyslog_conf_name is string
      - docker_rsyslog_log_file_owner is string
      - docker_rsyslog_log_file_group is string
      - docker_rsyslog_log_file_mode is string
    fail_msg: >-
      Invalid logging variables (types must be strings, docker_log_directory_path must be empty or a valid
      multi-component path not pointing to system root directories)
    success_msg: "Logging variables are valid"

- name: Docker | assert | Validate logrotate options
  ansible.builtin.assert:
    that:
      - docker_logrotate_options is defined
      - docker_logrotate_options is mapping
      - docker_logrotate_options.archive_directory_path is defined
      - docker_logrotate_options.archive_directory_path is string
      - docker_logrotate_options.frequency is defined
      - docker_logrotate_options.frequency is string
      - docker_logrotate_options.frequency in ['hourly', 'daily', 'weekly', 'monthly']
      - docker_logrotate_options.count is defined
      - docker_logrotate_options.count is number
      - docker_logrotate_options.missingok is defined
      - docker_logrotate_options.missingok is boolean
      - docker_logrotate_options.compress is defined
      - docker_logrotate_options.compress is boolean
      - docker_logrotate_options.nocreate is defined
      - docker_logrotate_options.nocreate is boolean
      - docker_logrotate_options.copytruncate is defined
      - docker_logrotate_options.copytruncate is boolean
      - docker_logrotate_options.dateext is defined
      - docker_logrotate_options.dateext is boolean
    fail_msg: "Invalid logrotate configuration options"
    success_msg: "Logrotate configuration options are valid"

- name: Docker | assert | Validate logrotate create options
  ansible.builtin.assert:
    that:
      - docker_logrotate_create is mapping
      - docker_logrotate_create.enabled is boolean
      - docker_logrotate_create.mode is string
      - docker_logrotate_create.owner is string
      - docker_logrotate_create.group is string
    fail_msg: "Invalid docker_logrotate_create options"
    success_msg: "docker_logrotate_create options are valid"

# -----------------------------------------------------------------------------
# 7. Prune Timer
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate prune configuration
  ansible.builtin.assert:
    that:
      - docker_prune_enabled is boolean
      - docker_prune_frequency in ['daily', 'weekly', 'monthly']
      - docker_prune_flags is string
    fail_msg: "Invalid prune settings (check frequency and flags)"
    success_msg: "Prune settings are valid"

# -----------------------------------------------------------------------------
# 8. Backup Timer
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate backup configuration
  ansible.builtin.assert:
    that:
      - docker_backup_enabled is boolean
      - docker_backup_frequency in ['hourly', 'daily', 'weekly', 'monthly']
      - docker_backup_retention is number
      - (docker_backup_retention | int) >= 1
      - docker_backup_path is string
      - docker_backup_path is match('^/')
      - docker_backup_include_volumes_metadata is boolean
    fail_msg: "Invalid backup settings (check retention, frequency, and absolute path)"
    success_msg: "Backup settings are valid"

# -----------------------------------------------------------------------------
# 9. Networks
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate docker_networks structure
  ansible.builtin.assert:
    that:
      - docker_networks is sequence
      - >-
        docker_networks | selectattr('name', 'undefined') | list | length == 0
      - >-
        docker_networks | selectattr('name', 'equalto', '') | list | length == 0
      - >-
        docker_networks | selectattr('subnet', 'defined')
        | rejectattr('subnet', 'match', '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
        | list | length == 0
    fail_msg: "docker_networks entries must be mappings with a non-empty name and valid CIDR subnets if specified"
    success_msg: "docker_networks structure is valid"

# -----------------------------------------------------------------------------
# 10. Audit
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate audit configuration
  ansible.builtin.assert:
    that:
      - docker_audit_socket is boolean
    fail_msg: "docker_audit_socket must be boolean"
    success_msg: "Audit configuration is valid"

# -----------------------------------------------------------------------------
# 11. System Validation Settings
# -----------------------------------------------------------------------------
- name: Docker | assert | Validate system validation flags
  ansible.builtin.assert:
    that:
      - docker_validate_system is boolean
      - docker_validate_connectivity is boolean
      - docker_validate_prerequisites is boolean
      - docker_collect_system_info is boolean
      - (docker_connectivity_timeout | int) > 0
    fail_msg: "Validation flags must be boolean and timeout must be > 0"
    success_msg: "Validation flags are valid"

- name: Docker | assert | Report validation results
  ansible.builtin.debug:
    msg:
      - "Docker Variable Validation Completed Successfully:"
      - "   State: {{ docker_state }}"
      - "   Service Enabled: {{ docker_service_enabled }}"
      - "   Prune Enabled: {{ docker_prune_enabled }} ({{ docker_prune_frequency }})"
      - "   Backup Enabled: {{ docker_backup_enabled }} (retention: {{ docker_backup_retention }})"
      - "   Rsyslog Enabled: {{ docker_configure_rsyslog }}"
      - "   Users in docker group: {{ docker_users | length }}"
    verbosity: 1
