---
# =============================================================================
# Ansible Role: Docker - Tasks: Backup Timer Configuration
# =============================================================================
# Configures systemd timer, service, and script for periodic Docker backups.
# =============================================================================

- name: Docker | backup | Ensure backup directory exists
  become: true
  ansible.builtin.file:
    path: "{{ docker_backup_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Docker | backup | Deploy backup script
  become: true
  ansible.builtin.template:
    src: scripts/docker-backup.sh.j2
    dest: /usr/local/bin/docker-backup
    owner: root
    group: root
    mode: '0755'
    backup: true

- name: Docker | backup | Deploy systemd service
  become: true
  ansible.builtin.template:
    src: systemd/docker-backup.service.j2
    dest: /etc/systemd/system/docker-backup.service
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Docker | handlers | Reload systemd

- name: Docker | backup | Deploy systemd timer
  become: true
  ansible.builtin.template:
    src: systemd/docker-backup.timer.j2
    dest: /etc/systemd/system/docker-backup.timer
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Docker | handlers | Reload systemd

- name: Docker | backup | Enable and start timer
  become: true
  ansible.builtin.systemd_service:
    name: docker-backup.timer
    enabled: true
    state: started
